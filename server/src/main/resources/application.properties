spring.application.name=MessReduction

# =============================================
# SERVER CONFIG
# Render injects PORT env var dynamically
# =============================================
server.port=${PORT:8080}
server.address=0.0.0.0

# =============================================
# DATABASE CONFIG
# Set these env vars on Render or in .env:
# =============================================
spring.datasource.url=${SPRING_DATABASE_URL}
spring.datasource.username=${SPRING_DATABASE_USERNAME}
spring.datasource.password=${SPRING_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool tuning for Render free tier
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =============================================
# JPA / HIBERNATE
# =============================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# =============================================
# JWT CONFIGURATION
# =============================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# =============================================
# CORS
# =============================================
allowed.origins=${ALLOWED_ORIGINS}

# ==============================    ===============
# FIREBASE CONFIG
# =============================================
firebase.config.path=classpath:firebase-service-account.json

# =============================================
# LOGGING
# =============================================
logging.level.root=INFO
logging.level.com.hostel=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =============================================
# ACTUATOR — health check for Render
# =============================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# =============================================
# STUDENT VERIFICATION API
# =============================================
student.verify.api.url=${STUDENT_VERIFY_API_URL}
student.verify.api.key=${STUDENT_VERIFY_API_KEY}
student.verify.enabled=${STUDENT_VERIFY_ENABLED:true}

# =============================================
# WEB PUSH CONFIGURATION
# =============================================
webpush.public-key=${VAPID_PUBLIC_KEY}
webpush.private-key=${VAPID_PRIVATE_KEY}
webpush.subject=${VAPID_SUBJECT:mailto:admin@example.com}

# =============================================
# BATCH PUSH NOTIFICATION CONFIGURATION
# =============================================
notification.batch.enabled=${NOTIFICATION_BATCH_ENABLED:true}
notification.batch.interval.minutes=${NOTIFICATION_BATCH_INTERVAL:30}

# =============================================
# REMINDER PUSH NOTIFICATION CONFIGURATION
# =============================================
notification.reminder.enabled=${NOTIFICATION_REMINDER_ENABLED:true}
notification.reminder.interval.hours=${NOTIFICATION_REMINDER_INTERVAL_HOURS:3}

# =============================================
# TELEGRAM ALERT BOT
# =============================================
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.chat.id=${TELEGRAM_CHAT_ID}