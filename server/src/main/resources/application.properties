spring.application.name=MessReduction

# =============================================
# SERVER CONFIG
# Render injects PORT env var dynamically
# =============================================
server.port=${PORT:8080}
server.address=0.0.0.0

# =============================================
# DATABASE CONFIG
# Set these env vars on Render:
#   DATABASE_URL  — full JDBC URL
#   DATABASE_USERNAME
#   DATABASE_PASSWORD
# =============================================
spring.datasource.url=${SPRING_DATABASE_URL:jdbc:postgresql://ep-snowy-leaf-aormjz9l-pooler.c-2.ap-southeast-1.aws.neon.tech/MessReduction?sslmode=require&channel_binding=require}
spring.datasource.username=${SPRING_DATABASE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATABASE_PASSWORD:npg_70OsEwvkWlDj}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool tuning for Render free tier
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =============================================
# JPA / HIBERNATE
# =============================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# =============================================
# JWT CONFIGURATION
# Render env vars: JWT_SECRET, JWT_EXPIRATION
# Fallbacks are used for local development only.
# On Render: set JWT_SECRET to a strong random string (min 32 chars)
#   e.g. openssl rand -base64 64
# =============================================
jwt.secret=${JWT_SECRET:MySecretKeyForJWTTokenGenerationMessReductionApp2024}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =============================================
# CORS — Set ALLOWED_ORIGINS env var on Render
# Multiple origins: comma-separated
# Example: https://mess.onrender.com,https://www.yourdomain.com
# =============================================
allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
# =============================================
# FIREBASE CONFIG
# =============================================
firebase.config.path=classpath:firebase-service-account.json

# =============================================
# MAIL CONFIGURATION
# Set MAIL_USERNAME and MAIL_PASSWORD on Render
# =============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:admin@example.com}
spring.mail.password=${MAIL_PASSWORD:password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =============================================
# LOGGING — production-friendly
# =============================================
logging.level.root=WARN
logging.level.com.hostel=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =============================================
# ACTUATOR — health check for Render
# =============================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never