spring.application.name=MessReduction

# =============================================
# SERVER CONFIG & TOMCAT THREAD POOL TUNING
# Render injects PORT env var dynamically
# =============================================
server.port=${PORT:8080}
server.address=0.0.0.0

# Tomcat Thread Pool Tuning
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.max-connections=8192

# =============================================
# DATABASE CONFIG
# Set these env vars on Render or in .env:
# =============================================
spring.datasource.url=${SPRING_DATABASE_URL}
spring.datasource.username=${SPRING_DATABASE_USERNAME}
spring.datasource.password=${SPRING_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Tuning for High Concurrency
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA/HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.order_deletes=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# FLYWAY
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# =============================================
# JWT CONFIGURATION
# =============================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# =============================================
# CORS
# =============================================
allowed.origins=${ALLOWED_ORIGINS}

# =============================================
# FIREBASE CONFIG
# =============================================
firebase.project.id=${FIREBASE_PROJECT_ID:fcm-notification7}
firebase.client.email=${FIREBASE_CLIENT_EMAIL:}
firebase.private.key=${FIREBASE_PRIVATE_KEY:}
firebase.private.key.id=${FIREBASE_PRIVATE_KEY_ID:}
firebase.client.id=${FIREBASE_CLIENT_ID:}
firebase.config.path=${FIREBASE_CONFIG_PATH:classpath:firebase-service-account.json}

# =============================================
# LOGGING
# =============================================
logging.level.root=INFO
logging.level.com.hostel=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =============================================
# ACTUATOR — health check for Render
# =============================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# =============================================
# STUDENT VERIFICATION API
# =============================================
student.verify.api.url=${STUDENT_VERIFY_API_URL}
student.verify.api.key=${STUDENT_VERIFY_API_KEY}
student.verify.enabled=${STUDENT_VERIFY_ENABLED:true}

# =============================================
# WEB PUSH CONFIGURATION
# =============================================
webpush.public-key=${VAPID_PUBLIC_KEY}
webpush.private-key=${VAPID_PRIVATE_KEY}
webpush.subject=${VAPID_SUBJECT:mailto:admin@example.com}

# =============================================
# BATCH PUSH NOTIFICATION CONFIGURATION
# =============================================
notification.batch.enabled=${NOTIFICATION_BATCH_ENABLED:true}
notification.batch.interval.minutes=${NOTIFICATION_BATCH_INTERVAL:30}

# =============================================
# REMINDER PUSH NOTIFICATION CONFIGURATION
# =============================================
notification.reminder.enabled=${NOTIFICATION_REMINDER_ENABLED:true}
notification.reminder.interval.hours=${NOTIFICATION_REMINDER_INTERVAL_HOURS:3}

# =============================================
# TELEGRAM ALERT BOT
# =============================================
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.chat.id=${TELEGRAM_CHAT_ID}

# =============================================
# BULK OPERATION LIMITS
# =============================================
# Maximum number of records accepted in a single bulk operation.
# Requests exceeding this limit are rejected with HTTP 400.
app.bulk.max-size=${APP_BULK_MAX_SIZE:500}

# =============================================
# PUSH NOTIFICATION EXECUTOR (dedicated pool)
# =============================================
# Replaces CompletableFuture.runAsync() default ForkJoinPool.commonPool.
# Tasks are submitted after transaction commit (see NotificationService).
app.notification.executor.core-pool-size=${PUSH_EXECUTOR_CORE:4}
app.notification.executor.max-pool-size=${PUSH_EXECUTOR_MAX:10}
app.notification.executor.queue-capacity=${PUSH_EXECUTOR_QUEUE:500}
