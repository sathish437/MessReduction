spring.application.name=MessReduction-Test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=YEAR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

jwt.secret=test_jwt_secret_key_must_be_at_least_32_characters_long_12345
jwt.expiration=86400000

allowed.origins=http://localhost:5173

student.verify.api.url=http://localhost:8080/api/auth/verify-details
student.verify.api.key=test-api-key
student.verify.enabled=false

webpush.public-key=test_vapid_public_key
webpush.private-key=test_vapid_private_key
webpush.subject=mailto:admin@test.com

notification.batch.enabled=false
notification.reminder.enabled=false

telegram.bot.token=test_bot_token
telegram.chat.id=test_chat_id

app.hostel.sso-secret=test_messreduction_sso_secret_32_chars_min
app.hostel.sso-window-seconds=60
app.frontend.url=
